name: Build and publish amd 64 Docker image

on:
  workflow_call:
    inputs:
      image_name: 
        description: image name
        required: true
        type: string
      ref_name: 
        description: ref name
        required: true
        type: string
      actor: 
        description: actor
        required: true
        type: string
      registry: 
        description: registry
        required: true
        type: string
permissions:
  contents: read
  packages: write

jobs:
  reuse-build-and-push:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version number
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=${{ env.VERSION }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.ref_name }}
          build-args: |
            CONTAINER_VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write manifest and build history file 🏷
        run: |
          Rscript manifestR.R \
            --registry ${{ env.REGISTRY }} \
            --owner ${{ env.OWNER }} \
            --image ${{ inputs.image }} \
            --variant ${{ inputs.variant }} \
            --hist-lines-dir /tmp/r-dev/hist_lines/ \
            --manifests-dir /tmp/r-dev/manifests/ \
            --repository ${{ github.repository }}
        shell: bash
      - name: Upload manifest file 💾
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.variant }}-manifest
          path: /tmp/jupyter/manifests/${{ inputs.platform }}-${{ inputs.variant }}-${{ inputs.image }}-*.md
          retention-days: 3
      - name: Upload build history line 💾
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.variant }}-history_line
          path: /tmp/jupyter/hist_lines/${{ inputs.platform }}-${{ inputs.variant }}-${{ inputs.image }}-*.txt
          retention-days: 3

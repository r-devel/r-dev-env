name: Call reusable workflows

on:
  push:
    branches:
      - master
      - devel

jobs:
  call-workflow-amd64:
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: iaine/r-dev-env/.github/workflows/reuse-build-and-publish.yml@devel
    with:
      config-path: .github/labeler.yml
      event_name: ${{ github.event_name }}
      pull_request: ${{ github.pull_request.merged }}
      repository: ${{ github.event_name }}
      version: ${{ github.event_name }}
      image_name: ${{ github.repository }}
      ref_name: ${{ github.branch }}
      actor: ${{ github.actor }}
    secrets: inherit
